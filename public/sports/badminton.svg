<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191522"/>
      <stop offset="100%" stop-color="#0e0a14"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#badGrad)"/>

  <!-- Badminton Racket & Shuttle graphic -->
  <g transform="translate(420, 110)">
    <!-- Shuttlecock -->
    <path d="M 40 40 L 70 80 L 10 80 Z" fill="rgba(255, 255, 255, 0.85)" stroke="#D7F171" stroke-width="2"/>
    <ellipse cx="40" cy="40" rx="12" ry="10" fill="#B8A1E3"/>
    
    <!-- Motion lines -->
    <path d="M 0 160 Q 40 100 80 40" fill="none" stroke="#D7F171" stroke-width="2.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Content text -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#B8A1E3"/>
    <text x="70" y="17" fill="#111111" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BADMINTON // SINGLES</text>
    <text x="0" y="65" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">Explosive Reflexes &amp;</text>
    <text x="0" y="100" fill="#D7F171" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">Physical Agility</text>
    <text x="0" y="140" fill="#AAAAAA" font-family="'Inter', sans-serif" font-size="13">University Sports Fest Quarter-Finalist</text>
    <text x="0" y="165" fill="#888888" font-family="'Inter', sans-serif" font-size="12">Fast footwork, rapid split-second decisions, and high court endurance.</text>
    <text x="0" y="185" fill="#888888" font-family="'Inter', sans-serif" font-size="12">A rigorous counter-balance to long hours of engineering focus.</text>
    
    <rect x="0" y="220" width="220" height="36" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="15" y="243" fill="#B8A1E3" font-family="DM Sans, sans-serif" font-size="11">Singles League • 2023–24</text>
  </g>
</svg>
