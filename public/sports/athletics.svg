<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="athGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191612"/>
      <stop offset="100%" stop-color="#0f0c08"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#athGrad)"/>

  <!-- Track Curves -->
  <g stroke="rgba(215, 241, 113, 0.2)" stroke-width="2" fill="none">
    <ellipse cx="480" cy="200" rx="180" ry="120"/>
    <ellipse cx="480" cy="200" rx="140" ry="90"/>
    <ellipse cx="480" cy="200" rx="100" ry="60"/>
  </g>

  <!-- Content text -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#D7F171"/>
    <text x="75" y="17" fill="#111111" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ATHLETICS // 4X100M</text>
    <text x="0" y="65" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">Sprint Speed &amp;</text>
    <text x="0" y="100" fill="#D7F171" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">Relay Synchronization</text>
    <text x="0" y="140" fill="#AAAAAA" font-family="'Inter', sans-serif" font-size="13">Silver Medal • 4x100m Relay Anchor</text>
    <text x="0" y="165" fill="#888888" font-family="'Inter', sans-serif" font-size="12">Flawless baton transfers at maximum sprint velocity.</text>
    <text x="0" y="185" fill="#888888" font-family="'Inter', sans-serif" font-size="12">Mastery over explosive acceleration, form, and team cohesion.</text>
    
    <rect x="0" y="220" width="220" height="36" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="15" y="243" fill="#D7F171" font-family="DM Sans, sans-serif" font-size="11">Silver Medalist • 2022–23</text>
  </g>
</svg>
