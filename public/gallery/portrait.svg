<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E22"/>
      <stop offset="50%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0D0D0F"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4D5C7"/>
      <stop offset="100%" stop-color="#C2A895"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232328"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="750" rx="20" fill="url(#portGrad)"/>

  <!-- Minimal Editorial Geometry & Coordinates -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="1">
    <line x1="40" y1="40" x2="560" y2="40"/>
    <line x1="40" y1="710" x2="560" y2="710"/>
    <line x1="40" y1="40" x2="40" y2="710"/>
    <line x1="560" y1="40" x2="560" y2="710"/>
    <line x1="300" y1="40" x2="300" y2="710" stroke-dasharray="4 6"/>
  </g>

  <!-- Corner Coordinates -->
  <text x="60" y="65" fill="#D7F171" font-family="DM Sans, sans-serif" font-size="11" letter-spacing="1">LAT 31.25°N // LON 75.70°E</text>
  <text x="540" y="65" fill="#B8A1E3" font-family="DM Sans, sans-serif" font-size="11" text-anchor="end">ECE // ARCHIVE</text>

  <!-- Editorial Geometric Silhouette Portrait -->
  <g transform="translate(300, 420)" filter="url(#softShadow)">
    <!-- Shoulders & Coat -->
    <path d="M -180 250 C -170 120, -110 90, -50 80 L 0 140 L 50 80 C 110 90, 170 120, 180 250 Z" fill="url(#coatGrad)"/>
    
    <!-- White Minimal Collar / Shirt -->
    <path d="M -50 80 L 0 140 L 50 80 L 30 50 L -30 50 Z" fill="#F7F6F2"/>

    <!-- Neck -->
    <rect x="-32" y="-10" width="64" height="70" rx="8" fill="#C2A895"/>

    <!-- Jawline & Head Structure -->
    <path d="M -60 -40 C -60 40, -45 65, 0 75 C 45 65, 60 40, 60 -40 C 60 -120, -60 -120, -60 -40 Z" fill="url(#faceGrad)"/>
    
    <!-- Hair Modern Editorial Cut -->
    <path d="M -68 -50 C -70 -130, -20 -150, 20 -145 C 65 -140, 75 -90, 68 -45 C 50 -60, 40 -85, -20 -85 C -45 -85, -60 -65, -68 -50 Z" fill="#17171A"/>

    <!-- Eyeglasses (Minimalist Architectural Round Frames) -->
    <g stroke="#D7F171" stroke-width="2.5" fill="none">
      <circle cx="-28" cy="-25" r="20"/>
      <circle cx="28" cy="-25" r="20"/>
      <line x1="-8" y1="-25" x2="8" y2="-25"/>
      <line x1="-48" y1="-25" x2="-62" y2="-28"/>
      <line x1="48" y1="-25" x2="62" y2="-28"/>
    </g>

    <!-- Subtle Feature Lines -->
    <path d="M -2 -15 L 0 -5 L 6 -5" fill="none" stroke="#A68772" stroke-width="2" stroke-linecap="round"/>
    <path d="M -16 22 Q 0 30 16 22" fill="none" stroke="#8E6A55" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Ambient Floating Technical UI Pill -->
  <g transform="translate(70, 580)">
    <rect width="210" height="54" rx="27" fill="rgba(247, 246, 242, 0.9)" stroke="#E8E6E1" filter="url(#softShadow)"/>
    <circle cx="28" cy="27" r="10" fill="#D7F171"/>
    <circle cx="28" cy="27" r="4" fill="#111111"/>
    <text x="50" y="24" fill="#171717" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">PRATHAMESH</text>
    <text x="50" y="40" fill="#777777" font-family="DM Sans, sans-serif" font-size="9.5">ECE • LPU CLASS OF 2029</text>
  </g>

  <!-- Floating Sensor Node Tag -->
  <g transform="translate(370, 210)">
    <rect width="165" height="42" rx="21" fill="rgba(17, 17, 17, 0.85)" stroke="rgba(215, 241, 113, 0.4)" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="5" fill="#D7F171"/>
    <text x="36" y="25" fill="#F7F6F2" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Hardware &amp; AI Focus</text>
  </g>

  <text x="300" y="685" fill="#666666" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="4" text-anchor="middle">DIGITAL IDENTITY • NEXUS SYSTEM</text>
</svg>
