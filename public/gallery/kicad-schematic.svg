<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="schGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1813"/>
      <stop offset="100%" stop-color="#060c09"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#schGrad)"/>

  <!-- KiCad Grid and Title Block -->
  <g stroke="rgba(51, 193, 119, 0.1)" stroke-width="1">
    <line x1="40" y1="40" x2="760" y2="40"/>
    <line x1="40" y1="460" x2="760" y2="460"/>
    <line x1="40" y1="40" x2="40" y2="460"/>
    <line x1="760" y1="40" x2="760" y2="460"/>
  </g>

  <!-- Schematics symbols -->
  <g transform="translate(100, 100)" stroke="#33c177" stroke-width="2" fill="none">
    <!-- Op-amp symbol -->
    <polygon points="120,80 120,200 220,140" fill="#0c1f17" stroke="#33c177" stroke-width="2"/>
    <line x1="60" y1="110" x2="120" y2="110"/>
    <line x1="60" y1="170" x2="120" y2="170"/>
    <line x1="220" y1="140" x2="300" y2="140"/>

    <!-- Resistor feedback -->
    <path d="M 260 140 L 260 60 L 200 60 L 195 50 L 185 70 L 175 50 L 165 70 L 155 50 L 145 60 L 90 60 L 90 110"/>
    <circle cx="260" cy="140" r="3" fill="#33c177"/>
    <circle cx="90" cy="110" r="3" fill="#33c177"/>

    <!-- Labels -->
    <text x="135" y="115" fill="#D7F171" font-family="DM Sans, sans-serif" font-size="12" stroke="none">-</text>
    <text x="135" y="175" fill="#D7F171" font-family="DM Sans, sans-serif" font-size="12" stroke="none">+</text>
    <text x="160" y="40" fill="#B8A1E3" font-family="DM Sans, sans-serif" font-size="11" stroke="none">Rf = 100kΩ</text>
    <text x="310" y="145" fill="#D7F171" font-family="DM Sans, sans-serif" font-size="11" stroke="none">V_OUT</text>
  </g>

  <!-- Title Block Bottom Right -->
  <g transform="translate(460, 360)">
    <rect x="0" y="0" width="290" height="90" fill="#08140f" stroke="#33c177" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="290" y2="30" stroke="#33c177" stroke-width="1"/>
    <line x1="0" y1="60" x2="290" y2="60" stroke="#33c177" stroke-width="1"/>
    <text x="15" y="20" fill="#D7F171" font-family="DM Sans, sans-serif" font-size="10" font-weight="700">KICAD EDA // SCHEMATIC SHEET 1/2</text>
    <text x="15" y="50" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12">Structural Strain Signal Conditioner</text>
    <text x="15" y="80" fill="#888888" font-family="DM Sans, sans-serif" font-size="10">Author: Prathamesh • Rev: 3.2</text>
  </g>
</svg>
