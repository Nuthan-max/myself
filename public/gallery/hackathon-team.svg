<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="teamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151C"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#teamGrad)"/>

  <!-- Hackathon Workstation Setup -->
  <g transform="translate(140, 120)">
    <!-- Main Display -->
    <rect x="80" y="40" width="360" height="210" rx="10" fill="#1B1E28" stroke="#D7F171" stroke-width="2"/>
    <rect x="95" y="55" width="330" height="180" rx="4" fill="#0E1017"/>
    
    <!-- Code on Screen -->
    <text x="115" y="85" fill="#D7F171" font-family="'JetBrains Mono', monospace" font-size="11"># Team Byte Me // SIH Live Ingest</text>
    <text x="115" y="108" fill="#B8A1E3" font-family="'JetBrains Mono', monospace" font-size="10">async def process_telemetry(payload):</text>
    <text x="135" y="128" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10">  debris = model.predict(payload['frame'])</text>
    <text x="135" y="148" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10">  await broadcast_geojson(debris)</text>
    <text x="115" y="172" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="10"># Status: Stream 200 OK • 60 FPS</text>

    <!-- Monitor Stand -->
    <rect x="240" y="250" width="40" height="50" fill="#2A2E3D"/>
    <ellipse cx="260" cy="300" rx="60" ry="12" fill="#202330"/>

    <!-- Keyboard & Laptop -->
    <polygon points="120,320 400,320 440,360 80,360" fill="#171922" stroke="rgba(255, 255, 255, 0.1)"/>
  </g>

  <!-- Team Badge -->
  <rect x="60" y="420" width="140" height="30" rx="15" fill="#D7F171"/>
  <text x="130" y="440" fill="#111" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">BYTE ME // TEAM</text>
  
  <text x="220" y="435" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600">Smart India Hackathon Collaboration Sprint</text>
  <text x="220" y="452" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="11">Hardware-Software co-design, 36 uninterrupted innovation hours</text>
</svg>
