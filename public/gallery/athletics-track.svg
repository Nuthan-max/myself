<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1310"/>
      <stop offset="100%" stop-color="#0a0705"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" rx="20" fill="url(#trackGrad)"/>

  <!-- Track Lane Curves -->
  <g stroke="rgba(215, 241, 113, 0.25)" stroke-width="2.5" fill="none">
    <path d="M 60 750 C 60 400, 200 200, 600 200"/>
    <path d="M 120 750 C 120 440, 240 260, 600 260"/>
    <path d="M 180 750 C 180 480, 280 320, 600 320"/>
  </g>

  <!-- Lane Markings -->
  <text x="145" y="700" fill="#D7F171" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">LANE 4</text>
  <text x="145" y="725" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="11">4X100M RELAY • ANCHOR LEG</text>

  <!-- Editorial Info Box -->
  <rect x="60" y="80" width="480" height="130" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="85" y="120" fill="#D7F171" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">Athletic Training &amp; Endurance Conditioning</text>
  <text x="85" y="148" fill="#AAAAAA" font-family="'Inter', sans-serif" font-size="13">University Sports Complex • Speed intervals, baton handoff mechanics</text>
  <text x="85" y="172" fill="#B8A1E3" font-family="'JetBrains Mono', monospace" font-size="12">Silver Medalist • 2023 Season</text>
</svg>
