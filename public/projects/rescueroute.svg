<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="routeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7F171"/>
      <stop offset="100%" stop-color="#B8A1E3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Blocked / Hazard Zones -->
  <circle cx="430" cy="240" r="42" fill="rgba(255, 75, 75, 0.12)" stroke="#ff4d4d" stroke-dasharray="4 4" stroke-width="1.5"/>
  <circle cx="430" cy="240" r="6" fill="#ff4d4d"/>
  <text x="445" y="244" fill="#ff6b6b" font-family="'Space Grotesk', monospace" font-size="11" letter-spacing="1">HAZARD BLOCK: SECTOR 4</text>

  <!-- Graph Connections (Normal) -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="120" y1="380" x2="240" y2="310"/>
    <line x1="240" y1="310" x2="430" y2="240"/>
    <line x1="430" y1="240" x2="680" y2="140"/>
    <line x1="240" y1="310" x2="280" y2="420"/>
    <line x1="280" y1="420" x2="520" y2="410"/>
    <line x1="520" y1="410" x2="680" y2="140"/>
    <line x1="120" y1="380" x2="200" y2="180"/>
    <line x1="200" y1="180" x2="340" y2="120"/>
  </g>

  <!-- Optimal Dynamic Route (A* recalculated) -->
  <path d="M 120 380 L 200 180 L 360 130 L 530 170 L 680 140" fill="none" stroke="url(#routeGlow)" stroke-width="4" filter="url(#glow)"/>

  <!-- Graph Nodes -->
  <g fill="#171717" stroke="#D7F171" stroke-width="2.5">
    <circle cx="120" cy="380" r="9"/>
    <circle cx="200" cy="180" r="7"/>
    <circle cx="360" cy="130" r="7"/>
    <circle cx="530" cy="170" r="7"/>
    <circle cx="680" cy="140" r="11" fill="#D7F171" stroke="#FFFFFF"/>
    
    <circle cx="240" cy="310" r="6" stroke="#888"/>
    <circle cx="280" cy="420" r="6" stroke="#888"/>
    <circle cx="520" cy="410" r="6" stroke="#888"/>
  </g>

  <!-- Start / End Badges -->
  <rect x="80" y="405" width="80" height="24" rx="12" fill="#D7F171"/>
  <text x="120" y="421" fill="#111" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" text-anchor="middle">ORIGIN</text>

  <rect x="635" y="90" width="90" height="24" rx="12" fill="#B8A1E3"/>
  <text x="680" y="106" fill="#111" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" text-anchor="middle">DESTINATION</text>

  <!-- Telemetry HUD -->
  <rect x="30" y="30" width="230" height="65" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="45" y="52" fill="#D7F171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">RESCUEROUTE KERNEL v2.4</text>
  <text x="45" y="70" fill="#AAAAAA" font-family="'JetBrains Mono', monospace" font-size="10">Reroute Latency: 1.2ms (A* Dynamic)</text>
  <text x="45" y="84" fill="#AAAAAA" font-family="'JetBrains Mono', monospace" font-size="10">Status: Safe Corridor Active (60fps)</text>
</svg>
